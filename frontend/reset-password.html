<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · ScholarMatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">

    <div class="auth-visual">
        <div class="auth-brand">
            <div class="mark">SM</div>
            <div class="name">ScholarMatch</div>
        </div>
        <div class="auth-headline">
            <span class="eyebrow">Account recovery</span>
            <h1>Set a new password.</h1>
            <p>This link is single-use and time-limited — once you set a new password, this link stops working.</p>
        </div>
    </div>

    <div class="auth-form-side">
        <div class="auth-card">
            <h2>Choose a new password</h2>
            <p class="sub" id="resetSub">Enter and confirm your new password below.</p>

            <form id="resetForm">
                <div class="field">
                    <label>New password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" minlength="8" required>
                </div>
                <div class="field">
                    <label>Confirm new password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" minlength="8" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="resetBtn">Reset password</button>
            </form>

            <p class="auth-foot"><a href="student-login.html" style="color:var(--indigo-600); font-weight:600;">Back to sign in</a></p>

            <div class="auth-demo" id="resetMsg" style="display:none;"></div>
        </div>
    </div>

</div>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
    const resetToken = new URLSearchParams(window.location.search).get("token");
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("resetMsg");

    if (!resetToken){
        form.style.display = "none";
        document.getElementById("resetSub").textContent = "This reset link is missing or malformed.";
        msg.textContent = "No reset token found in the URL. Request a new link from the Forgot Password page.";
        msg.style.color = "var(--red-600, #DC2626)";
        msg.style.display = "block";
    }

    form.addEventListener("submit", async function(e){
        e.preventDefault();
        const btn = document.getElementById("resetBtn");
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        msg.style.display = "none";

        if (newPassword !== confirmPassword){
            msg.textContent = "Passwords do not match.";
            msg.style.color = "var(--red-600, #DC2626)";
            msg.style.display = "block";
            return;
        }

        btn.disabled = true; btn.textContent = "Resetting…";

        try{
            await smApi.resetPassword(resetToken, newPassword);
            form.style.display = "none";
            msg.textContent = "Your password has been reset successfully. You can now sign in with your new password.";
            msg.style.color = "";
            msg.style.display = "block";
            setTimeout(() => { window.location.href = "student-login.html"; }, 2000);
        }catch(err){
            // Covers: invalid token, already-used token, expired token — backend message is shown as-is.
            msg.textContent = err.message;
            msg.style.color = "var(--red-600, #DC2626)";
            msg.style.display = "block";
            btn.disabled = false; btn.textContent = "Reset password";
        }
    });
</script>
</body>
</html>
