spring.application.name=ScholarMatch

spring.datasource.url=jdbc:mysql://localhost:3306/scholarmatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
jwt.secret=replace-this-with-a-long-random-base64-secret-at-least-32-bytes-long
jwt.expiration-ms=86400000
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=claude-haiku-4-5-20251001
ai.anthropic.base-url=https://api.anthropic.com/v1/messages
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

scholarship.reminder.days-before-deadline=7
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

file.upload.base-dir=uploads
file.upload.allowed-extensions=pdf,jpg,jpeg,png
file.upload.max-size-bytes=5242880

auth.rate-limit.max-attempts=5
auth.rate-limit.window-ms=60000
app.reset-password.base-url=http://localhost:5500/frontend/reset-password.html
app.reset-password.token-expiry-minutes=30